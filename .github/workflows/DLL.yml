name: Build ATAS McpBridge DLL

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-dll:
    name: Build DLL
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish C# Addon
        run: |
          Get-ChildItem -Recurse -Filter *.csproj | ForEach-Object { dotnet publish $_.FullName -c Release -o ./output }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATAS.McpBridge-DLL
          path: ./output/*.dll
